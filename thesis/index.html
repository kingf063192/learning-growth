<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf2f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="论文进度">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<title>论文进度 · 导师协作</title>
<style>
:root{--pink:#b43b70;--soft:#f9e9ef;--bg:#fcf8fa;--ink:#392c35;--muted:#796b75;--line:#eadce3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:18px;margin:0 0 2px}
h2{font-size:15px;margin:0 0 8px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.meta{color:var(--muted);font-size:12.5px}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pct{font-size:26px;font-weight:800;color:var(--pink);line-height:1}
.bar{height:8px;background:#f3e6ec;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:var(--pink);border-radius:99px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font:inherit;color:inherit;cursor:pointer;min-height:36px}
button.primary{background:var(--pink);border-color:var(--pink);color:#fff}
input,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;width:100%;background:#fff;min-height:40px}
textarea{min-height:70px;resize:vertical}
.form{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.task{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.task input[type=checkbox]{width:22px;height:22px;min-width:22px;accent-color:var(--pink);margin-top:2px}
.task .body{flex:1;min-width:150px}
.task.done .body b{text-decoration:line-through;color:var(--muted)}
.task .sub{flex-basis:100%;margin:6px 0 0 32px;border-left:2px solid var(--soft);padding-left:10px}
.subhead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px}
.cmt{border-bottom:1px dashed var(--line);padding:6px 0}
.cmt p{margin:2px 0 0}
.upload{display:inline-block;border:1px dashed var(--pink);color:var(--pink);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13.5px}
.tag{background:var(--soft);color:var(--pink);border-radius:99px;padding:1px 8px;font-size:11.5px}
.codebox{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;word-break:break-all}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#392c35;color:#fff;padding:9px 16px;border-radius:99px;font-size:13.5px;display:none;z-index:99;max-width:90%}
a{color:var(--pink)}
@media(min-width:700px){.wrap{max-width:760px;padding:28px 24px 60px}}

.flow{list-style:none;padding:0;margin:8px 0 0}
.flow li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.flow li:last-child{border-bottom:none}
.flow .no{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted)}
.flow li.done .no{background:#2f8f6b;border-color:#2f8f6b;color:#fff}
.flow li.now .no{background:var(--pink);border-color:var(--pink);color:#fff}
.flow .b{flex:1;min-width:0}
.flow .t{font-size:14px;font-weight:600}
.flow .m{font-size:12px;color:var(--muted);margin-top:1px}
.flow .d{font-size:11.5px;color:var(--muted);white-space:nowrap;flex:none;padding-top:2px}
.jt{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
.jt th,.jt td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.jt th{background:#fcfafb;font-weight:600;font-size:12px;color:var(--muted)}
.jt .tier{white-space:nowrap;font-weight:600}

.stage{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff}
.stage.locked{opacity:.55;background:#fcfafb}
.stage.now{border-color:var(--pink);box-shadow:0 0 0 3px var(--soft)}
.stage.done{background:#f7fbf8;border-color:#cfe9da}
.sh{display:flex;gap:10px;align-items:flex-start}
.sh .idx{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted)}
.stage.done .idx{background:#2f8f6b;border-color:#2f8f6b;color:#fff}
.stage.now .idx{background:var(--pink);border-color:var(--pink);color:#fff}
.sh .st{flex:1;min-width:0}
.sb{font-size:11px;padding:1px 8px;border-radius:99px;white-space:nowrap}
.sb.done{background:#e6f6ee;color:#1f7a52}
.sb.wait{background:#fdf6e3;color:#b8860b}
.sb.lock{background:#f1f2f4;color:#8a8f98}
.sb.now{background:var(--soft);color:var(--pink)}
.cl{list-style:none;padding:0;margin:8px 0}
.cl li{padding:3px 0;font-size:13.5px}
.cl input{width:19px;height:19px;accent-color:var(--pink);margin-right:6px;vertical-align:-3px}
.sf{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sf button{min-height:36px}
.sf .link{border:none;background:none;color:var(--pink);padding:0 4px}
.cli{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cli label{flex:1;min-width:200px}
.cli .mini{font-size:11.5px;min-height:28px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.cli .edtag{font-size:10.5px;color:#b8860b;background:#fdf6e3;border-radius:99px;padding:1px 6px}
.cli .note{flex-basis:100%;font-size:12.5px;color:#7a5a1a;background:#fffaf0;border-left:3px solid #f0d9a8;padding:4px 8px;margin:2px 0 4px}
.cli .editbox{flex-basis:100%;display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.cli .editbox input,.cli .editbox textarea{font-size:13px}
.cli .editbox textarea{min-height:56px}
.orig{color:#a8a2a8;text-decoration:line-through;text-decoration-thickness:1.5px}
.newtxt{color:var(--pink);font-weight:500}
.hist{flex-basis:100%;font-size:11.5px;color:var(--muted);border-left:3px solid var(--line);padding:2px 8px;margin:0 0 4px;line-height:1.6}

.tabs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.tabs button{flex:1;min-width:72px;min-height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px}
.tabs button.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
.manage{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sop{display:flex;gap:6px;margin-left:auto}
.sop button{min-height:28px;padding:2px 8px;font-size:11.5px;border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(57,44,53,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:460px;max-height:86vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:16px}
.modal label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 2px}
.modal input,.modal textarea{width:100%;font-size:14px}
.modal .acts{display:flex;gap:8px;margin-top:12px}
.modal .acts button{flex:1;min-height:42px}
.aiarea{width:100%;min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.theme-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.theme-bar .sw{width:26px;height:26px;min-height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.theme-bar .sw.on{outline:2px solid var(--pink);outline-offset:2px}
.rolebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rolebadge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.rolebadge.owner{background:#e8f1fb;color:#2f6fb3}
.rolebadge.advisor{background:#f0ebfb;color:#6b4bb8}
.rolebar .link{margin-left:auto;border:none;background:none;color:var(--pink);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>论文进度</h1>
  <p class="meta">只同步论文部分；学生与导师都可以勾选、留言、传文件。</p>

  <div id="app"></div>
</div>
<div id="toast" role="status"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
