<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fb3"><title>学习与成长 Lite</title>
<style>
:root{--bg:#fbf9fa;--card:#fff;--ink:#22252a;--muted:#8a8f98;--line:#eee7ec;--blue:#2f6fb3;--orange:#c2703a;--green:#2f8f6b;--purple:#6b4bb8;--gray:#8a8f98}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:70px}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 20px}
h1{font-size:18px;margin:0 0 2px}
.sub{font-size:12.5px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;border:none;background:none;padding:9px 0;font-size:11.5px;color:var(--muted)}
nav button.on{color:var(--blue);font-weight:700}
section{display:none}section.on{display:block}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel h2{font-size:14px;margin:0 0 8px}
.meta{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.rbody{flex:1;min-width:0}
.t{font-size:14.5px}
.small{font-size:11.5px;color:var(--muted)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue)}
.x{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:16px}
.bar{height:7px;background:#f1eef0;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.add input[type=text]{flex:1;min-width:120px}
.add input,.add select,.add button{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;background:#fff}
.add button{background:var(--blue);color:#fff;border-color:var(--blue)}
.tt{width:100%;border-collapse:collapse;table-layout:fixed;min-width:720px}
.tt th,.tt td{border:1px solid var(--line);vertical-align:top;padding:3px}
.tt th{font-size:11.5px;color:var(--muted);background:#fff}
.tt .slot{width:66px;font-size:11px;color:var(--muted);background:#fcfafb;text-align:right;padding:4px}
.ev{display:block;width:100%;text-align:left;border-radius:6px;padding:3px 5px;margin:1px 0;font-size:11px;line-height:1.3;border:1px solid;overflow:hidden}
.scroll{overflow-x:auto}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw button.on{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
</style></head><body>
<div class="wrap">
<h1>学习与成长 Lite</h1><div class="sub" id="sub"></div>
<section id="s-today" class="on">
  <div class="panel"><h2>今天要做</h2><div id="todayList"></div>
    <div class="add"><input type="text" id="nt" placeholder="加一条任务"><select id="nc"></select><button id="addBtn">添加</button></div>
  </div>
</section>
<section id="s-week"><div class="panel"><h2>本周</h2><div class="scroll"><table class="tt" id="tt"></table></div>
  <p class="meta" style="margin-top:8px">蓝=专业课 · 橙=兴趣 · 绿=游戏 · 紫=论文 · 灰=生活；实线不能拖，虚线可拖动改时间段。</p></div></section>
<section id="s-progress"><div class="panel"><h2>进度</h2><div id="progList"></div></div></section>
<section id="s-set">
  <div class="panel"><h2>主题色</h2><div class="sw" id="sw"></div></div>
  <div class="panel"><h2>备份</h2><div class="add"><button id="expBtn">导出备份</button><button id="impBtn">导入备份</button><input type="file" id="impFile" class="hidden" accept=".json"></div></div>
  <div class="panel"><h2>重置</h2><div class="add"><button id="rstBtn" style="background:#b4453f;border-color:#b4453f">清空本机数据</button></div></div>
</section>
</div>
<nav>
 <button data-t="today" class="on">今日</button><button data-t="week">行程</button><button data-t="progress">进度</button><button data-t="set">设置</button>
</nav>
<script>
const KEY='growth-lite-v1';
const THEMES=[['蓝','#2f6fb3'],['青','#1f7a52'],['紫','#6b4bb8'],['橙','#b8621f'],['玫','#b43b70'],['墨','#2f3337']];
const CAT={'专业':{bg:'#e8f0ff',bd:'#b6cdf7',tx:'#2f5fae'},
 '兴趣':{bg:'#fdeee3',bd:'#f3c9a8',tx:'#a55a25'},
 '游戏':{bg:'#e6f6ee',bd:'#b3e0c9',tx:'#1f7a52'},
 '论文':{bg:'#f1ebff',bd:'#c9b6f2',tx:'#5b3fa8'},
 '生活':{bg:'#f1f2f4',bd:'#d8dade',tx:'#61666e'}};
const SLOTS=[['早','08:30','10:10'],['上午','10:25','12:05'],['下午','14:00','17:35'],['傍晚','18:30','19:30'],['晚上','19:30','22:00'],['睡前','22:00','22:30']];
const COURSES=[
 {id:'inorg',n:'无机与分析化学',cat:'专业',exam:true},{id:'org',n:'有机化学',cat:'专业',exam:true},
 {id:'food',n:'食品工艺学',cat:'专业',exam:true},{id:'cook',n:'烹饪化学',cat:'专业',exam:true},
 {id:'cai',n:'中国名菜',cat:'专业',exam:true},{id:'dian',n:'中国名点',cat:'专业',exam:true},
 {id:'lit',n:'文献检索',cat:'专业',exam:false},{id:'inno',n:'创新创业',cat:'专业',exam:false},
 {id:'lab',n:'无机实验',cat:'专业',exam:false,startWeek:14},
 {id:'eng',n:'英语二',cat:'专业',exam:false,kao:true},{id:'bio',n:'338 生物化学',cat:'专业',exam:false,kao:true},
 {id:'cell',n:'860 细胞生物学',cat:'专业',exam:false,kao:true},{id:'pol',n:'101 政治',cat:'专业',exam:false,kao:true,startDate:'2027-07-01'},
 {id:'thesis',n:'毕业论文',cat:'论文',exam:false},
 {id:'archery',n:'射箭',cat:'兴趣'},{id:'draw',n:'绘画',cat:'兴趣'},{id:'drum',n:'架子鼓',cat:'兴趣'},{id:'dou',n:'拼豆店',cat:'兴趣'},
 {id:'ff14',n:'FF14 固定队',cat:'游戏'},
 {id:'life',n:'服药 / 陪聊 / 复诊',cat:'生活'}
];
const FIXED=[
 [1,'上午','无机与分析化学'], [1,'傍晚','射箭'], [1,'晚上','FF14 固定队'],
 [2,'上午','食品工艺学'], [2,'晚上','有机化学'],
 [3,'早','文献检索'], [3,'上午','文献检索'], [3,'下午','创新创业'], [3,'晚上','烹饪化学'],
 [4,'早','中国名菜'], [4,'上午','中国名菜'], [4,'傍晚','射箭'], [4,'晚上','FF14 固定队'],
 [5,'上午','形势与政策'], [5,'下午','中国名点'], [5,'傍晚','射箭'], [5,'晚上','FF14 固定队'],
 [6,'下午','架子鼓课'], [6,'晚上','FF14 固定队'], [0,'晚上','FF14 固定队'],
 [0,'睡前','陪聊'],[1,'睡前','陪聊'],[2,'睡前','陪聊'],[3,'睡前','陪聊'],[4,'睡前','陪聊'],[5,'睡前','陪聊'],[6,'睡前','陪聊']
].filter(x=>x[2]!=='形势与政策');
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>iso(new Date());
function addD(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)}
const TERM='2026-09-07';
function week(){return Math.floor((new Date(today()+'T12:00')-new Date(TERM+'T12:00'))/604800000)+1}
function monday(){const d=new Date(today()+'T12:00');const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)}
let S=JSON.parse(localStorage.getItem(KEY)||'null');
function def(){return {tasks:[],theme:0,done:{},bonus:0}}
if(!S)S=def();
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function toast(m){const t=document.getElementById('sub');t.textContent=m;setTimeout(()=>render(),2500)}
/* 作业规则 */
function specs(){
  const t=today(),out=[];
  const wk=week();
  const mon=monday();
  for(let k=0;k<6;k++){
    const w=wk+k; const m=addD(TERM,(w-1)*7); if(new Date(m+'T12:00')<new Date(t+'T12:00'))continue;
    if(w<=12){const thu=addD(m,3);out.push({id:'cai:'+thu,course:'cai',title:'中国名菜 · 实训报告',date:addD(thu,7),cat:'专业'});
      const wed=addD(m,2);out.push({id:'inno:'+wed,course:'inno',title:'创新创业 · 学习通作业',date:addD(wed,7),cat:'专业'})}
    if(w<=16){['课堂笔记','思维导图','手写作业'].forEach(n=>out.push({id:'inorg:'+m+':'+n,course:'inorg',title:'无机化学 · '+n,date:addD(m,7),cat:'专业'}))}
    if(w>=14){const wed=addD(m,2);out.push({id:'lab:'+wed,course:'lab',title:'无机实验 · 实训报告',date:addD(wed,7),cat:'专业'})}
  }
  const s0=addD(t,14),e0='2027-01-08';const span=Math.max(1,Math.round((new Date(e0+'T12:00')-new Date(s0+'T12:00'))/86400000));
  for(let i=0;i<5;i++)out.push({id:'org:'+i,course:'org',title:'有机化学 · 第 '+(i+1)+' 次书面作业',date:addD(s0,Math.round(span*i/4)),cat:'专业'});
  out.push({id:'lit:1',course:'lit',title:'文献检索 · 开题报告',date:addD(t,14),cat:'专业'});
  if('2026-11-06'>=t)out.push({id:'dian:exam',course:'dian',title:'中国名点 · 结业考试',date:'2026-11-06',cat:'专业',fixed:true});
  return out;
}
function ensureHW(){
  const have=new Set(S.tasks.map(x=>x.id));
  specs().forEach(x=>{if(!have.has(x.id))S.tasks.push({...x,done:false,hw:true})});
  save();
}
/* 今日任务 */
function todayTasks(){ensureHW();return S.tasks.filter(x=>x.date===today())}
function planToday(){
  const t=today();
  const have=S.tasks.filter(x=>x.date===t&&!x.hw);
  if(have.length>=4)return;
  const cand=COURSES.filter(c=>c.cat==='专业'&&!c.kao&&!c.exam!==false);
  const pool=[];
  COURSES.filter(c=>c.cat==='专业').forEach(c=>{
    if(c.id==='pol'&&today()<'2027-07-01')return;
    if(c.kao&&today()<'2026-12-28')return; // 期末前只保期末课
    if(c.exam||c.kao)pool.push(c);
  });
  for(const c of pool){
    if(S.tasks.filter(x=>x.date===t&&x.course===c.id).length)continue;
    S.tasks.push({id:'plan:'+c.id+':'+t,course:c.id,title:c.n+' · 30 分钟',date:t,done:false});
    if(S.tasks.filter(x=>x.date===t&&!x.hw).length>=4)break;
  }
  save();
}
/* 渲染 */
function catOf(id){const c=COURSES.find(x=>x.id===id);return c?c.cat:'专业'}
function render(){
  document.getElementById('sub').textContent=today()+' · 第 '+week()+' 周';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===cur));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+cur));
  if(cur==='today')renderToday();
  if(cur==='week')renderWeek();
  if(cur==='progress')renderProg();
  if(cur==='set')renderSet();
}
function renderToday(){
  planToday();
  const todayStr=today();
  // 一个列表：今天的 + 有截止日的，全是要完成的任务
  const list=S.tasks.filter(x=>!x.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  const doneList=S.tasks.filter(x=>x.done);
  const l=document.getElementById('todayList');
  const item=x=>{
    const c=CAT[catOf(x.course)]||CAT['专业'];
    const due=x.date?x.date.slice(5):'未定';
    const late=x.date&&x.date<todayStr;
    return `<div class="row ${x.done?'done':''}"><input type="checkbox" data-tg="${x.id}" ${x.done?'checked':''}>
      <div class="rbody"><div class="t">${x.title}</div><div class="small">${x.date?(late?'已逾期 · ':'截止 ')+due:'今天'}</div></div>
      ${x.hw?'':`<button class="x" data-split="${x.id}">×</button>`}</div>`;
  };
  l.innerHTML=(list.map(item).join('')||'<p class="meta">今天没有任务</p>')+(doneList.length?'<p class="small" style="margin:10px 0 4px">已完成</p>'+doneList.slice(-5).map(item).join(''):'');
  l.querySelectorAll('[data-tg]').forEach(b=>b.onchange=()=>{const t=S.tasks.find(x=>x.id===b.dataset.tg);t.done=b.checked;if(b.checked)S.bonus++;save();render()});
  l.querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>split(b.dataset.split));
  const sel=document.getElementById('nc');
  if(!sel.options.length)sel.innerHTML=COURSES.map(c=>`<option value="${c.id}">${c.n}</option>`).join('');
}
function split(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const base=t.title.replace(/（\d+\/\d+）$/,'');const parts=2;
  S.tasks.push({id:id+'-a',course:t.course,title:base+'（1/2）· 先做 10 分钟',date:today(),done:false});
  S.tasks.push({id:id+'-b',course:t.course,title:base+'（2/2）· 明天接着',date:addD(today(),1),done:false});
  S.tasks=S.tasks.filter(x=>x.id!==id);save();render();toast('已拆成两步');
}
function renderWeek(){
  const mon=monday();
  const days=Array.from({length:7},(_,i)=>addD(mon,i));
  let html='<tr><th class="slot">时段</th>'+['一','二','三','四','五','六','日'].map((d,i)=>`<th>周${d}<br><span class="small">${days[i].slice(5)}</span></th>`).join('')+'</tr>';
  for(const [sl,s,e] of SLOTS){
    html+='<tr><th class="slot">'+sl+'<br><span class="small">'+s+'</span></th>';
    for(let wd=0;wd<7;wd++){
      const d=days[wd];const items=[];
      FIXED.filter(f=>f[0]===((new Date(d+'T12:00').getDay()+6)%7)&&f[1]===sl).forEach(f=>items.push({title:f[2],cat:'专业',lock:true}));
      S.tasks.filter(x=>x.date===d&&!x.hw).forEach(x=>{
        if(sl==='晚上'&&x.course==='thesis')items.push({title:x.title,cat:'论文',lock:false});
        else if(x.start===s||(!x.start&&sl==='下午'&&wd===6))items.push({title:x.title,cat:catOf(x.course),lock:false});
      });
      const wkd=(new Date(d+'T12:00').getDay()+6)%7;
      if(wkd===0&&sl==='晚上')items.push({title:'FF14 固定队',cat:'游戏',lock:true});
      if(wkd===5&&sl==='下午')items.push({title:'架子鼓课',cat:'兴趣',lock:true});
      html+='<td>'+items.map(it=>{const c=CAT[it.cat]||CAT['专业'];return `<span class="ev" style="background:${c.bg};border-color:${c.bd};color:${c.tx};border-style:${it.lock?'solid':'dashed'}">${it.title}</span>`}).join('')+'</td>';
    }
    html+='</tr>';
  }
  document.getElementById('tt').innerHTML=html;
}
function renderProg(){
  const out=COURSES.filter(c=>c.cat==='专业').map(c=>{
    const all=S.tasks.filter(x=>x.course===c.id);
    const done=all.filter(x=>x.done).length;
    const pct=all.length?Math.round(done/all.length*100):0;
    const col=catOf(c.id)==='专业'?'#2f6fb3':'#6b4bb8';
    return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><b>${c.n}</b><span style="color:${col}">${pct}%</span></div>
      <div class="bar"><i style="width:${pct}%;background:${col}"></i></div><div class="small">${done}/${all.length} 条任务完成</div></div>`;
  }).join('');
  document.getElementById('progList').innerHTML=out||'<p class="meta">还没有数据</p>';
}
function renderSet(){
  const sw=document.getElementById('sw');
  sw.innerHTML=THEMES.map((t,i)=>`<button data-th="${t[1]}" class="${S.theme===i?'on':''}" style="background:${t[1]}"></button>`).join('');
  sw.querySelectorAll('[data-th]').forEach((b,i)=>b.onclick=()=>{S.theme=i;document.documentElement.style.setProperty('--blue',b.dataset.th);save();renderSet()});
}
const themes=['#2f6fb3','#1f7a52','#6b4bb8','#b8621f','#b43b70','#2f3337'];
document.documentElement.style.setProperty('--blue',themes[S.theme||0]);
let cur='today';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{cur=b.dataset.t;render()});
document.getElementById('addBtn').onclick=()=>{
  const t=document.getElementById('nt').value.trim();const c=document.getElementById('nc').value;
  if(!t)return;S.tasks.push({id:'m:'+Date.now(),course:c,title:t,date:today(),done:false});document.getElementById('nt').value='';save();render();
};
document.getElementById('expBtn').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lite-backup-'+today()+'.json';a.click()};
document.getElementById('impBtn').onclick=()=>document.getElementById('impFile').click();
document.getElementById('impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render()}catch(err){alert('格式不对')}};r.readAsText(f)};
document.getElementById('rstBtn').onclick=()=>{if(confirm('清空本机数据？')){S=def();save();render()}};
ensureHW();render();
</script></body></html>
